<svg xmlns="http://www.w3.org/2000/svg" width="720" height="180" viewBox="0 0 720 180" role="img" aria-labelledby="title desc">
  <title id="title">Loudr logo</title>
  <desc id="desc">The word Loudr in bold italic white lettering followed by three green bars.</desc>
  <g transform="translate(22 139) skewX(-10)">
    <text
      x="0"
      y="0"
      fill="#f5f6f1"
      font-family="DM Sans, Arial Black, Arial, sans-serif"
      font-size="140"
      font-style="italic"
      font-weight="900"
      letter-spacing="-10"
    >LOUDR</text>
  </g>
  <g fill="#bdff3c" transform="translate(560 22) skewX(-10)">
    <rect x="0" y="48" width="18" height="68" rx="1"/>
    <rect x="31" y="8" width="18" height="108" rx="1"/>
    <rect x="62" y="32" width="18" height="84" rx="1"/>
  </g>
</svg>
